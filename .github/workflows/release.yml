name: Release

# Push a tag such as v1.0.0 to publish an Android APK on the GitHub Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep annotated tag objects so release notes contain their message, not the commit title.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional release signing. Without these secrets the APK is signed with a throwaway
      # debug key, which installs fine but cannot upgrade over a differently signed build.
      - name: Configure signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # One universal APK for anyone unsure, plus smaller per-ABI APKs (same versionCode).
      - run: flutter build apk --release
      - name: Test native countdown notifications
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - run: flutter build apk --release --split-per-abi
      - name: Name release assets
        run: |
          out=build/app/outputs/flutter-apk
          mkdir dist
          cp "$out/app-release.apk" "dist/yonggui-tong-${GITHUB_REF_NAME}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "dist/yonggui-tong-${GITHUB_REF_NAME}-$abi.apk"
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Never publish an APK that does not start (1.1.0 crashed at launch).
      - name: Launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: tool/smoke_test_apk.sh dist/yonggui-tong-${{ github.ref_name }}-x86_64.apk
      - name: Prepare release notes
        run: |
          notes=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
          signature=$(git for-each-ref --format='%(contents:signature)' "refs/tags/$GITHUB_REF_NAME")
          printf '%s\n' "${notes%"$signature"}" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'

          **该下哪个？** 绝大多数手机选 `arm64-v8a`；很老的 32 位手机选 `armeabi-v7a`；`x86_64` 用于模拟器和少数平板；不确定就下 `universal`（包含全部架构，体积最大）。
          几个安装包版本号相同，可以互相覆盖安装，也都能直接升级上一个版本。
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-notes.md
