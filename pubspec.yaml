name: yonggui_tong
description: 宁波地铁综合出行助手「甬轨通」
publish_to: none
version: 1.3.2+7

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  collection: ^1.19.1
  dynamic_color: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/network.json
    - assets/brand.png
    - assets/fonts/OFL.txt
  fonts:
    - family: YongguiSans
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
